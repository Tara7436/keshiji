<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课时记 · 学生课时台账</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 登录页 -->
  <div id="login" class="login">
    <div class="login-card">
      <div class="brand">
        <span class="seal">记</span>
        <span class="brand-name">课时记</span>
      </div>
      <p class="login-sub">输入同步码，多设备自动同步。</p>
      <div class="field">
        <label>同步码</label>
        <input id="codeInput" autocomplete="off" spellcheck="false" placeholder="如 KSHJ-XXXX-XXXX-XXXX">
      </div>
      <button class="btn btn-primary" id="codeBtn">进入</button>
      <button class="btn btn-link" id="genCodeBtn">生成一个同步码</button>
      <p class="login-hint">同步码就是你的钥匙：在另一台设备输入同一个码，即可看到并同步同一份数据。请务必妥善保存。</p>
    </div>
  </div>

  <!-- 应用 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <span class="seal">记</span>
        <div class="brand-text">
          <span class="brand-name">课时记</span>
          <span class="brand-sub">学生课时台账</span>
        </div>
      </div>
      <nav class="tabs">
        <button class="tab active" data-view="ledger">学生台账</button>
        <button class="tab" data-view="income">收入统计</button>
      </nav>
      <div class="top-right">
        <span class="sync" id="syncIndicator" data-s="ok">已同步</span>
        <div class="month-pill" id="headerIncome"></div>
        <button class="icon-btn" id="userMenu" aria-label="菜单">⋯</button>
      </div>
    </header>

    <!-- 学生台账 -->
    <section id="view-ledger" class="view">
      <div id="alertBand" class="alert-band hidden"></div>
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="searchInput" placeholder="搜索学生姓名">
        </div>
        <select id="sortSelect">
          <option value="remaining">按剩余课时排序</option>
          <option value="name">按姓名排序</option>
          <option value="recent">按最近记录排序</option>
        </select>
        <button class="btn btn-primary" id="addStudentBtn">＋ 新增学生</button>
      </div>
      <ul id="studentList" class="student-list"></ul>
    </section>

    <!-- 收入统计 -->
    <section id="view-income" class="view hidden">
      <div class="income-head">
        <h2 class="page-title">收入统计</h2>
        <div class="month-nav">
          <button class="icon-btn" id="prevMonth" aria-label="上个月">‹</button>
          <select id="monthSelect"></select>
          <button class="icon-btn" id="nextMonth" aria-label="下个月">›</button>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat stat-main">
          <span class="stat-label">课消收入</span>
          <span class="stat-value" id="statIncome">¥0</span>
        </div>
        <div class="stat"><span class="stat-label">消课节数</span><span class="stat-value" id="statLessons">0</span></div>
        <div class="stat"><span class="stat-label">请假节数</span><span class="stat-value" id="statLeaves">0</span></div>
        <div class="stat"><span class="stat-label">购课节数</span><span class="stat-value" id="statPurchases">0</span></div>
      </div>
      <div class="breakdown">
        <h3>按学生拆分</h3>
        <div id="breakdownList"></div>
      </div>
    </section>
  </div>

  <!-- 操作弹窗 -->
  <div id="modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="opTitle">消课</div>
          <div class="modal-sub" id="opStudent"></div>
        </div>
        <button class="modal-close" id="opClose" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="opBody"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="opCancel">取消</button>
        <button class="btn btn-primary" id="opConfirm">确认</button>
      </div>
    </div>
  </div>

  <!-- 学生详情抽屉 -->
  <div id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <div class="dr-top">
        <div>
          <div class="dr-name" id="drName"></div>
          <div class="dr-price" id="drPrice"></div>
        </div>
        <button class="modal-close" id="drawerClose" aria-label="关闭">×</button>
      </div>
      <div class="dr-num-row">
        <span class="dr-num" id="drNum"></span>
        <span class="dr-status" id="drStatus"></span>
      </div>
    </div>
    <div class="dr-actions">
      <button class="btn btn-primary" id="drLesson">消课</button>
      <button class="btn btn-ghost" id="drLeave">请假</button>
      <button class="btn btn-ghost" id="drPurchase">购课</button>
    </div>
    <ul class="dr-records" id="drRecords"></ul>
    <div class="dr-foot">
      <button class="btn" id="drEdit">编辑信息</button>
      <button class="btn" id="drDelete">删除学生</button>
    </div>
  </div>

  <!-- 用户菜单 -->
  <div id="userDropdown" class="dropdown hidden">
    <button id="showCodeBtn">复制我的同步码</button>
    <button id="logoutBtn">退出登录</button>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

<script src="app.js" defer></script>
</body>
</html>
